[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brane-package-migrate"
version = "0.1.0"
description = "Safe discovery and manifest-driven migration tooling for Brane packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
brane-package-migrate = "brane_package_migrate.cli:main"

[tool.setuptools]
package-dir = {"" = "tools/brane_package_migrate/src"}

[tool.setuptools.packages.find]
where = ["tools/brane_package_migrate/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
