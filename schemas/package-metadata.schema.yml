"$schema": "https://json-schema.org/draft/2020-12/schema"
title: "Brane package metadata"
description: "Metadata required for every shared Brane package and internal test fixture."
type: object
additionalProperties: false

required:
  - schema_version
  - name
  - version
  - classification
  - status
  - maintainers
  - source
  - compatibility
  - data_handling

properties:
  schema_version:
    type: string
    const: "1.0"

  name:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
    description: "Stable Brane package identifier."

  version:
    type: string
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([-.+][0-9A-Za-z.-]+)?$"

  classification:
    type: string
    enum:
      - shared-package
      - test-fixture

  status:
    type: string
    enum:
      - intake
      - candidate
      - stable
      - deprecated
      - retired

  description:
    type: string
    minLength: 1

  maintainers:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1

  source:
    type: object
    additionalProperties: false
    required:
      - type
      - location
      - source_path
    properties:
      type:
        type: string
        enum:
          - git
          - local-path
          - manually-created
      location:
        type: string
        minLength: 1
      revision:
        type: string
      source_path:
        type: string
        minLength: 1
      imported_at:
        type: string
        format: date-time

  compatibility:
    type: object
    additionalProperties: false
    required:
      - architectures
      - brane_baseline
    properties:
      architectures:
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - x86_64
            - aarch64
      brane_baseline:
        type: string
        minLength: 1

  data_handling:
    type: object
    additionalProperties: false
    required:
      - accepts_user_data
      - bundled_data
    properties:
      accepts_user_data:
        type: boolean
      bundled_data:
        type: string
        enum:
          - none
          - synthetic-fixtures-only

  licence:
    type: string

  notes:
    type: string
