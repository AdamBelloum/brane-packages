$schema: "https://json-schema.org/draft/2020-12/schema"
title: Brane package migration manifest
type: object
additionalProperties: false
required:
  - schema_version
  - source
  - candidates
properties:
  schema_version:
    const: "1.0"
  source:
    type: object
    additionalProperties: false
    required:
      - type
      - location
      - acquired_at
    properties:
      type:
        enum: [local-path, git]
      location:
        type: string
        minLength: 1
      revision:
        type: string
        minLength: 1
      acquired_at:
        type: string
        format: date-time
  candidates:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - source_path
        - classification
        - action
      properties:
        source_path:
          type: string
          minLength: 1
        target_path:
          type: string
          minLength: 1
        discovered_name:
          type: string
          minLength: 1
        classification:
          enum: [reusable, fixture, unsupported, needs-review]
        action:
          enum: [manual-review, migrate, ignore]
        author:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
            contact:
              type: string
              minLength: 1
        curation:
          type: object
          additionalProperties: false
          required:
            - status
            - description
            - maintainers
            - compatibility
            - data_handling
          properties:
            status:
              enum: [intake, candidate, stable, deprecated, retired]
            description:
              type: string
              minLength: 1
            maintainers:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            compatibility:
              type: object
              additionalProperties: false
              required: [architectures, brane_baseline]
              properties:
                architectures:
                  type: array
                  minItems: 1
                  items:
                    enum: [x86_64, aarch64]
                brane_baseline:
                  type: string
                  minLength: 1
            data_handling:
              type: object
              additionalProperties: false
              required: [accepts_user_data, bundled_data]
              properties:
                accepts_user_data:
                  type: boolean
                bundled_data:
                  enum: [none, synthetic-fixtures-only]
            licence:
              type: string
            notes:
              type: string
        review_notes:
          type: string
        review_required:
          type: array
          items:
            type: string
            minLength: 1
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [severity, message]
            properties:
              severity:
                enum: [blocking, warning, information]
              message:
                type: string
                minLength: 1
        packages:
          type: array
          items:
            type: string
            minLength: 1
      allOf:
        - if:
            properties:
              action:
                const: migrate
            required: [action]
          then:
            required: [target_path, author, curation]
